name: Qualify release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FOCUS_TRAIL_WORK_DIR: ${{ runner.temp }}/focus-trail-work
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/focus-trail-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Record the public release gate
        run: >-
          node -e "console.log('Candidate qualified and packed locally. Public npm publication remains gated on three independent maintainer installations and the reviewed pilot evidence in docs/pilot.md. This workflow does not publish or upload.');"
